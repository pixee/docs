name: PR Checks

on:
  pull_request:
  merge_group:

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: "yarn"
      - run: yarn install
      - name: Run prettier
        run: yarn check-format
